<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MPC/SRC WAREHOUSE</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col antialiased">

  <!-- SINGLE TOP HEADER (BLACK) -->
  <header class="bg-black text-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Title: MPC/SRC WAREHOUSE -->
      <a href="index.html" class="flex items-center gap-2 text-white hover:opacity-90 transition-opacity">
        <span class="text-lg sm:text-xl font-black tracking-tight">MPC/SRC WAREHOUSE</span>
      </a>

      <!-- Back to Catalog -->
      <div>
        <a 
          href="index.html" 
          class="px-3.5 py-2 rounded-xl text-xs font-bold border border-neutral-700 bg-neutral-900 hover:bg-neutral-800 transition-colors flex items-center gap-1.5"
        >
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Catalog</span>
        </a>
      </div>

    </div>
  </header>

  <!-- LOGIN CARD -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-sm w-full">
      
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-black text-white flex items-center justify-center mx-auto mb-3 text-lg">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900">Admin Login</h1>
        <p class="text-xs text-slate-400 mt-1">Sign in to edit warehouse inventory and manage stock</p>
      </div>

      <!-- Error / Status Message -->
      <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Incorrect password. Default is <strong>admin123</strong></span>
      </div>

      <!-- Form -->
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="admin-password-input" class="block text-xs font-bold text-slate-700 mb-1">Admin Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="admin-password-input" 
              required
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="Enter password..." 
              class="w-full pl-3.5 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white"
            >
            <button 
              type="button" 
              id="toggle-pwd-btn" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
              title="Show / Hide Password"
            >
              <i class="fa-solid fa-eye text-slate-400"></i>
            </button>
          </div>
          
          <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2">
            <span>Default: <strong class="text-slate-700">admin123</strong></span>
            <button type="button" id="fill-pwd-btn" class="text-blue-600 font-bold hover:underline">
              Auto-fill default
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl bg-black hover:bg-slate-800 text-white text-xs font-bold transition-all shadow-md active:scale-[0.99]"
        >
          Sign In to Admin Panel
        </button>

        <div class="pt-2 text-center border-t border-slate-100">
          <button type="button" id="reset-pwd-btn" class="text-[11px] text-slate-400 hover:text-rose-600 transition-colors">
            Trouble logging in? <span class="underline font-semibold">Reset to admin123</span>
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- MINIMAL FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    <p>MPC/SRC WAREHOUSE • Administration</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
